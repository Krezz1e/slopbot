name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Slopbot and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: mypy src

      - name: Run tests
        run: pytest

      - name: Check browser scripts
        run: |
          node --check src/slopbot/web/static/app.js
          node --check src/slopbot/web/static/dashboard.js
          node --check src/slopbot/web/static/controls.js
          node --check src/slopbot/web/static/reports.js
          node --check src/slopbot/web/static/service-worker.js

      - name: Install browser regression tools
        run: |
          npm install --prefix work/browser-tests --no-save --package-lock=false playwright@1.62.1
          work/browser-tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Check theme layout and live refresh
        env:
          NODE_PATH: ${{ github.workspace }}/work/browser-tests/node_modules
        run: |
          node tests/web_ui_smoke.cjs
          node tests/reports_ui_smoke.cjs

  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: rlservice/go.mod
          cache-dependency-path: rlservice/go.sum

      - name: Run tests
        run: go -C rlservice test ./...

      - name: Run vet
        run: go -C rlservice vet ./...
